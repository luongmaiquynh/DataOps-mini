global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'ntfy'
  routes:
    - match:
        severity: critical
      receiver: 'ntfy'
      continue: true

receivers:
  - name: 'ntfy'
    webhook_configs:
      - url: 'https://ntfy.sh/dataops-mini-alerts'
        send_resolved: true

# --- Cấu hình Gmail (tùy chọn thêm) ---
# Thêm receiver bên dưới và thêm vào route nếu muốn nhận cả email:
#
#   - name: 'email'
#     email_configs:
#       - to: 'your-email@gmail.com'
#         from: 'alertmanager@dataops.local'
#         smarthost: 'smtp.gmail.com:587'
#         auth_username: 'your-email@gmail.com'
#         auth_password: 'xxxx-xxxx-xxxx-xxxx'  # Gmail App Password
#         require_tls: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']
