global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'default'
      continue: true

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:5001/alert'
        send_resolved: true

# Để dùng email, thay webhook_configs bằng:
# email_configs:
#   - to: 'your-email@example.com'
#     from: 'alertmanager@dataops.local'
#     smarthost: 'smtp.gmail.com:587'
#     auth_username: 'your-email@example.com'
#     auth_password: 'your-app-password'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']
