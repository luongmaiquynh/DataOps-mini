---
groups:
  - name: infrastructure
    rules:
      # Cảnh báo khi instance down
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          runbook_url: "https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/InstanceDown.md"
          description: "{{ $labels.instance }} đã down hơn 1 phút."

      # Cảnh báo CPU cao
      - alert: HighCpuUsage
        expr: 100 - (avg by(instance, vm) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU cao trên {{ $labels.instance }}"
          runbook_url: "https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/HighCpuUsage.md"
          description: "CPU usage > 80% trong 5 phút liên tục."

      # Cảnh báo RAM thấp
      - alert: LowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RAM thấp trên {{ $labels.instance }}"
          runbook_url: "https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/LowMemory.md"
          description: "RAM khả dụng < 10%."

      # Cảnh báo disk gần đầy
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk sắp đầy trên {{ $labels.instance }}"
          runbook_url: "https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/DiskSpaceLow.md"
          description: "Disk còn < 15% dung lượng trống."

  - name: database
    rules:
      # Cảnh báo khi PostgreSQL down
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL down trên {{ $labels.instance }}"
          runbook_url: "https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/PostgreSQLDown.md"
          description: "PostgreSQL không kết nối được hơn 1 phút."

  - name: containers
    rules:
      # Cảnh báo container restart nhiều lần
      # Loại trừ airflow_* vì chúng restart bình thường khi postgres/redis down
      - alert: ContainerRestartingTooMuch
        expr: count by (name) (count_over_time(container_last_seen{name!="",name!~"airflow.*"}[15m])) >= 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restart liên tục"
          runbook_url: >-
            https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/ContainerRestartingTooMuch.md
          description: "Container restart >= 3 lần trong 15 phút."

  - name: backup
    rules:
      # Không có bản backup thành công nào trong 26 giờ qua.
      # Ngưỡng 26h thay vì 24h để chừa chỗ cho lần chạy 2:00 sáng bị chậm.
      - alert: BackupStale
        expr: time() - dataops_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Backup PostgreSQL đã quá hạn"
          runbook_url: "https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/BackupStale.md"
          description: >-
            Bản backup thành công gần nhất cách đây {{ $value | humanizeDuration }}.

      # Không có metric nào = cron không chạy, hoặc node-exporter mất textfile.
      - alert: BackupMetricMissing
        expr: absent(dataops_backup_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Không thấy metric backup"
          runbook_url: "https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/BackupMetricMissing.md"
          description: "Cron backup có thể không chạy, hoặc node-exporter mất thư mục textfile."

      # Backup tồn tại nhưng restore thử không thành công — nguy hiểm hơn cả
      # không có backup, vì dễ tạo cảm giác an toàn giả.
      - alert: BackupRestoreTestFailed
        expr: dataops_restore_test_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Bản backup không restore được"
          runbook_url: >-
            https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/BackupRestoreTestFailed.md
          description: "Lần kiểm chứng restore gần nhất thất bại. Backup hiện không dùng được."

      # MinIO chứa file raw của data lake. pg_dump không cứu được nó, nên nó
      # có bộ cảnh báo riêng.
      - alert: MinioBackupStale
        expr: time() - dataops_minio_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Sao lưu MinIO đã quá hạn"
          runbook_url: >-
            https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/MinioBackupStale.md
          description: >-
            Bản sao lưu MinIO thành công gần nhất cách đây {{ $value | humanizeDuration }}.

      - alert: MinioBackupMetricMissing
        expr: absent(dataops_minio_backup_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Không thấy metric sao lưu MinIO"
          runbook_url: >-
            https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/MinioBackupMetricMissing.md
          description: >-
            Cron sao lưu MinIO có thể không chạy, hoặc node-exporter mất thư mục textfile.

      # Bản sao MinIO tồn tại nhưng đổ ngược vào một MinIO trắng không ra đủ
      # object — nguy hiểm hơn không có bản sao, vì tạo cảm giác an toàn giả.
      - alert: MinioRestoreTestFailed
        expr: dataops_restore_test_minio_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Bản sao MinIO không khôi phục được"
          runbook_url: >-
            https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/MinioRestoreTestFailed.md
          description: >-
            Lần kiểm chứng khôi phục MinIO gần nhất thất bại. Data lake hiện không có bản sao dùng được.

      # Kiểm chứng chạy hàng tuần; quá 8 ngày là job đã ngừng.
      - alert: BackupRestoreTestStale
        expr: time() - dataops_restore_test_timestamp_seconds > 8 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Lâu rồi chưa kiểm chứng backup"
          runbook_url: "https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/BackupRestoreTestStale.md"
          description: >-
            Lần kiểm chứng restore gần nhất cách đây {{ $value | humanizeDuration }}.

  - name: pipeline
    rules:
      # Sự cố 17/09/2026: worker ngừng lấy việc 25,5 giờ mà mọi phép đo đều báo
      # xanh, vì không phép đo nào hỏi "hàng đợi có vơi không".
      #
      # Bắt đúng nguyên nhân gốc: không còn kết nối nào chờ lấy việc. Đo được cả
      # khi hệ thống đang rảnh, không cần đợi có task mới vào hàng đợi.
      - alert: CeleryNoConsumer
        expr: dataops_celery_consumers == 0
        for: 10m
        labels:
          severity: critical
          vm: vm1
        annotations:
          summary: "Không còn worker nào lấy việc khỏi hàng đợi"
          runbook_url: >-
            https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/CeleryNoConsumer.md
          description: >-
            Redis không có kết nối nào chờ ở BRPOP. Task mới sẽ nằm chờ mãi dù worker vẫn trả lời ping.

      # Ngưỡng PHẢI thấp hơn task_queued_timeout của Airflow (600 giây): quá mốc
      # đó scheduler tự đánh dấu task hỏng và tuổi task quay về 0. Bản đầu đặt
      # 900 giây nên alert này không bao giờ bật được.
      - alert: AirflowTaskStuckQueued
        expr: dataops_airflow_queued_task_age_seconds > 300
        for: 2m
        labels:
          severity: critical
          vm: vm1
        annotations:
          summary: "Task Airflow nằm chờ quá lâu"
          runbook_url: >-
            https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/AirflowTaskStuckQueued.md
          description: >-
            Task chờ lâu nhất đã chờ {{ $value | humanizeDuration }} mà chưa được worker nhận.

      - alert: CeleryQueueBacklog
        expr: dataops_celery_queue_length > 20
        for: 15m
        labels:
          severity: warning
          vm: vm1
        annotations:
          summary: "Hàng đợi Celery dồn việc"
          runbook_url: >-
            https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/CeleryQueueBacklog.md
          description: "Hàng đợi còn {{ $value }} việc chưa được xử lý sau 15 phút."

      - alert: CeleryMetricMissing
        expr: absent(dataops_celery_probe_success)
        for: 30m
        labels:
          severity: warning
          vm: vm1
        annotations:
          summary: "Không thấy phép đo hàng đợi Celery"
          runbook_url: >-
            https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/CeleryMetricMissing.md
          description: "Cron đo hàng đợi không chạy, hoặc node-exporter mất thư mục textfile."

  - name: time-and-cicd
    rules:
      # So đồng hồ mỗi máy với đồng hồ Prometheus ngay lúc lấy số liệu. KHÔNG dùng
      # node_timex_sync_status: ngày 18/09 VM2 chậm 44 phút mà metric đó vẫn báo 1
      # suốt 12 giờ, còn biểu thức này bắt được lệch 78 phút (VM2) và 18 phút (VM3).
      - alert: ClockSkew
        expr: abs(node_time_seconds - timestamp(node_time_seconds)) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Đồng hồ {{ $labels.vm }} lệch so với Prometheus"
          runbook_url: >-
            https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/ClockSkew.md
          description: "Đồng hồ {{ $labels.vm }} lệch {{ $value | humanizeDuration }} so với VM1."

      # Runner nay tự khởi động lại sau 60 giây, nên chết thật hiện ra dưới dạng
      # khởi động lại liên tục chứ không phải "không chạy" — phải bắt cả hai.
      - alert: GitHubRunnerDown
        expr: >-
          (dataops_systemd_unit_active{unit=~"actions\\.runner\\..+"} == 0)
          or (increase(dataops_systemd_unit_restarts_total{unit=~"actions\\.runner\\..+"}[30m]) > 3)
          or absent(dataops_systemd_unit_active{unit=~"actions\\.runner\\..+"})
        for: 15m
        labels:
          severity: warning
          vm: vm1
        annotations:
          summary: "Runner GitHub Actions không nhận được job"
          runbook_url: >-
            https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/GitHubRunnerDown.md
          description: "Runner trên VM1 đã dừng hoặc khởi động lại liên tục; CD sẽ không chạy."

  - name: endpoints
    rules:
      # Container có thể "Up" trong khi dịch vụ đã không trả lời được nữa.
      - alert: EndpointDown
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint {{ $labels.instance }} không phản hồi"
          runbook_url: "https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/EndpointDown.md"
          description: "Gọi thử từ blackbox-exporter không nhận được phản hồi hợp lệ."

      # CA nội bộ của Caddy cấp chứng chỉ hạn 12 giờ và tự gia hạn khi còn
      # khoảng 1/3 vòng đời. Ngưỡng phải nhỏ hơn thế, nếu không alert sẽ firing
      # vĩnh viễn — đúng kiểu cảnh báo rác làm người trực mất lòng tin.
      - alert: TLSCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Chứng chỉ của {{ $labels.instance }} sắp hết hạn"
          runbook_url: "https://github.com/luongmaiquynh/DataOps-mini/blob/main/docs/runbooks/TLSCertExpiringSoon.md"
          description: "Caddy lẽ ra tự gia hạn; cần kiểm tra vì sao không gia hạn được."

  - name: watchdog
    rules:
      # Alert này LUÔN firing, không phải lỗi. Nó là nhịp tim gửi đều đặn ra
      # dịch vụ bên ngoài. Khi nhịp tim ngừng, dịch vụ đó sẽ báo động — đó là
      # cách duy nhất biết được chính Prometheus hoặc Alertmanager đã chết.
      # 15/09/2026: Alertmanager từng câm 15 phút vì mạng ra ngoài chập chờn,
      # và không có gì báo cho ai biết.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Nhịp tim của hệ thống giám sát"
          description: "Luôn firing. Nếu nhịp này ngừng tới đích, hệ thống giám sát đã hỏng."
