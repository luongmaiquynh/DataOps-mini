global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  # Prometheus tự scrape chính nó
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter VM1 (máy chủ Airflow)
  - job_name: 'node-exporter-vm1'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          vm: 'vm1'
          role: 'airflow'

  # Node Exporter VM3
  - job_name: 'node-exporter-vm3'
    static_configs:
      - targets: ['192.168.64.4:9100']
        labels:
          vm: 'vm3'
          role: 'worker-backup'

  # cAdvisor – metrics container Docker
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # PostgreSQL Exporter (VM2)
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          vm: 'vm2'
          service: 'postgresql'
