---
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  # Prometheus tự scrape chính nó
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter VM1 (máy chủ Airflow)
  - job_name: 'node-exporter-vm1'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          vm: 'vm1'
          role: 'airflow'

  # Node Exporter VM2 (máy chạy database)
  - job_name: 'node-exporter-vm2'
    static_configs:
      - targets: ['192.168.64.3:9100']
        labels:
          vm: 'vm2'
          role: 'database'

  # Node Exporter VM3
  - job_name: 'node-exporter-vm3'
    static_configs:
      - targets: ['192.168.64.4:9100']
        labels:
          vm: 'vm3'
          role: 'worker-backup'

  # cAdvisor – metrics container Docker
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # PostgreSQL Exporter (VM2)
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          vm: 'vm2'
          service: 'postgresql'

  # Blackbox tự giám sát chính nó
  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['blackbox-exporter:9115']

  # Gọi thật vào từng endpoint qua đường mà người dùng đi
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx_any]
    static_configs:
      - targets:
          - https://airflow.dataops.test/health
          - https://grafana.dataops.test/api/health
          - https://prometheus.dataops.test/-/ready
          - https://alerts.dataops.test/-/ready
          - http://192.168.64.3:9000/minio/health/live
    relabel_configs:
      # Địa chỉ cần thử được truyền cho blackbox qua tham số target,
      # còn địa chỉ scrape thật là chính blackbox-exporter.
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
