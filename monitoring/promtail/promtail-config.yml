---
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # Đặt trong volume, không phải /tmp: mất file này thì Promtail đọc lại toàn bộ
  # log từ đầu và đẩy trùng vào Loki mỗi lần container được dựng lại.
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      - labels:
          stream:
      - output:
          source: log
