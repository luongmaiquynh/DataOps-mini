---
name: CD – Deploy to VM1

# Chỉ chạy SAU KHI CI xong, và chỉ khi CI xanh. Trước đây hai workflow chạy song
# song nên một commit làm hỏng test vẫn được đẩy lên VM1.
on:
  workflow_run:
    workflows: ["CI – Lint & Test"]
    types: [completed]
    branches: [main]

# Các lần deploy chạy lần lượt theo thứ tự, không bao giờ chồng lên nhau.
concurrency:
  group: deploy-vm1
  cancel-in-progress: false

jobs:
  deploy-vm1:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    environment: production

    steps:
      - name: Deploy Airflow DAGs
        run: |
          cd /home/dataops/dataops
          # reset --hard thay cho pull: Ansible cũng đẩy file xuống thư mục này
          # bằng rsync, nên pull hay bị chặn bởi file local. Repo là nguồn sự
          # thật duy nhất, ghi đè là đúng ý muốn.
          git fetch origin main
          # Deploy ĐÚNG commit vừa qua CI, không phải đầu mới nhất của main. Trước
          # đây CD của commit A (xanh) lấy luôn main, nên nếu commit B đỏ được push
          # ngay sau thì B vẫn bị deploy — cổng "CI xanh mới deploy" bị thủng.
          git reset --hard "${{ github.event.workflow_run.head_sha }}"
          docker exec airflow_scheduler airflow dags reserialize
          echo "Deploy DAGs completed at $(date)"

  deploy-monitoring:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    environment: production
    needs: deploy-vm1

    steps:
      - name: Deploy monitoring config
        run: |
          cd /home/dataops/dataops
          git fetch origin main
          # Deploy ĐÚNG commit vừa qua CI, không phải đầu mới nhất của main. Trước
          # đây CD của commit A (xanh) lấy luôn main, nên nếu commit B đỏ được push
          # ngay sau thì B vẫn bị deploy — cổng "CI xanh mới deploy" bị thủng.
          git reset --hard "${{ github.event.workflow_run.head_sha }}"
          # Kiểm tra TRƯỚC khi dựng lại container: nếu file cấu hình được mount
          # không tồn tại, Docker sẽ lặng lẽ tạo một THƯ MỤC trùng tên và dịch vụ
          # không khởi động được. Ngày 18/09 chuyện này đã đánh sập Alertmanager.
          for f in monitoring/prometheus/prometheus.yml \
                   monitoring/prometheus/alerts.yml; do
            [ -f "$f" ] || { echo "::error::Thiếu file cấu hình $f, dừng deploy"; exit 1; }
          done
          # Chỉ dựng lại Prometheus. Cấu hình Alertmanager chứa URL bí mật nên do
          # Ansible render từ vault, KHÔNG nằm trong git — CD không có quyền và
          # không có lý do gì để đụng vào nó.
          docker compose -f docker/dataops-vm1/docker-compose-monitoring.yml \
            up -d --force-recreate prometheus
          echo "Monitoring deploy completed at $(date)"
