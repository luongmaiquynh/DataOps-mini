name: CD – Deploy to VM1

on:
  push:
    branches: [main]

jobs:
  deploy-vm1:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Deploy Airflow DAGs
        run: |
          cd /home/dataops/dataops
          # reset --hard thay cho pull: Ansible cũng đẩy file xuống thư mục này
          # bằng rsync, nên pull hay bị chặn bởi file local. Repo là nguồn sự
          # thật duy nhất, ghi đè là đúng ý muốn.
          git fetch origin main
          git reset --hard FETCH_HEAD
          docker exec airflow_scheduler airflow dags reserialize
          echo "Deploy DAGs completed at $(date)"

  deploy-monitoring:
    runs-on: self-hosted
    environment: production
    needs: deploy-vm1

    steps:
      - name: Deploy monitoring config
        run: |
          cd /home/dataops/dataops
          git fetch origin main
          git reset --hard FETCH_HEAD
          docker compose -f docker/dataops-vm1/docker-compose-monitoring.yml \
            up -d --force-recreate prometheus alertmanager
          echo "Monitoring deploy completed at $(date)"
