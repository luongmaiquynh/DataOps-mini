---
name: CI – Lint & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas requests sqlalchemy psycopg2-binary boto3 \
                      flake8 pytest pytest-cov

      - name: Lint with flake8
        run: flake8 pipeline/etl/ pipeline/dags/ pipeline/tests/ --statistics

      - name: Run unit tests
        run: cd pipeline && pytest tests/ -v --tb=short

  infra:
    name: Infrastructure lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lint tools
        run: |
          pip install --upgrade pip
          pip install yamllint ansible-lint
          ansible-galaxy collection install -r infra/ansible/requirements.yml

      - name: Lint YAML
        run: yamllint .

      # ansible.cfg trỏ tới file mật khẩu vault nằm ngoài repo (máy vận hành).
      # Runner không có file đó nên ansible-lint chết ngay khi nạp cấu hình, báo
      # 13 lỗi internal-error. Lint không cần giải mã vault, chỉ cần file tồn tại.
      - name: Provide a dummy vault password file
        run: |
          mkdir -p ~/.ansible
          echo lint-only-not-a-real-secret > ~/.ansible/vault_pass_dataops
          chmod 600 ~/.ansible/vault_pass_dataops

      - name: Lint Ansible
        run: cd infra/ansible && ansible-lint

      # Ghim phiên bản: shellcheck có sẵn trên runner cũ hơn bản ở máy vận hành,
      # và hai bản gọi cùng một cảnh báo bằng hai mã khác nhau (SC2317/SC2329).
      # Không ghim thì máy mình xanh mà CI đỏ — đã xảy ra thật.
      - name: Lint shell scripts
        run: |
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0 \
            backup/*.sh monitoring/scripts/*.sh

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < docker/airflow/Dockerfile

      # Build thật image Airflow. Job Python chạy trên Python 3.11 với thư viện
      # mới nhất, nên không bắt được thư viện không cài nổi trên Python 3.8 của
      # image. Đã gặp thật: Dependabot đề xuất psycopg2-binary 2.9.9 -> 2.9.13,
      # trông như bản vá vô hại, nhưng từ 2.9.11 không còn bản cho Python 3.8.
      # Dockerfile tự import thử mọi thư viện nên build hỏng là CI đỏ.
      - name: Build Airflow image
        run: docker build -t dataops-airflow:ci docker/airflow

      # Compose dùng cú pháp ${BIEN:?...} nên phải có đủ biến mới kiểm tra được.
      # Giá trị ở đây chỉ để kiểm tra cú pháp, không phải secret thật.
      - name: Validate Docker Compose files
        run: |
          cat > /tmp/ci.env <<'ENVEOF'
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci
          POSTGRES_DB=ci
          POSTGRES_HOST=127.0.0.1
          POSTGRES_PORT=5432
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          REDIS_PASSWORD=ci
          MINIO_ROOT_USER=ci
          MINIO_ROOT_PASSWORD=ci
          MINIO_HOST=127.0.0.1
          MINIO_PORT=9000
          MINIO_BUCKET=ci
          AIRFLOW_IMAGE=apache/airflow:2.7.1
          AIRFLOW_ADMIN_USER=ci
          AIRFLOW_ADMIN_PASSWORD=ci
          AIRFLOW__CORE__FERNET_KEY=ci
          AIRFLOW__WEBSERVER__SECRET_KEY=ci
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://ci:ci@127.0.0.1:5432/ci
          AIRFLOW__CELERY__BROKER_URL=redis://:ci@127.0.0.1:6379/0
          AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://ci:ci@127.0.0.1:5432/ci
          GRAFANA_ADMIN_USER=ci
          GRAFANA_ADMIN_PASSWORD=ci
          ENVEOF
          for f in docker/dataops-vm1/docker-compose.yml \
                   docker/dataops-vm1/docker-compose-monitoring.yml \
                   docker/dataops-vm2/docker-compose.yml \
                   docker/dataops-vm3/docker-compose.yml; do
            echo "kiểm tra $f"
            docker compose --env-file /tmp/ci.env -f "$f" config -q
          done

      # Kiểm alert bằng promtool của ĐÚNG bản Prometheus đang chạy, đọc từ compose,
      # để Dependabot nâng Prometheus thì bước kiểm tra cũng nâng theo.
      - name: Detect Prometheus version
        run: |
          echo "PROM_IMAGE=$(grep -oE 'prom/prometheus:v[0-9.]+' \
            docker/dataops-vm1/docker-compose-monitoring.yml)" >> "$GITHUB_ENV"

      - name: Validate Prometheus rules
        run: |
          # entrypoint của image là prometheus, nên phải đổi mới gọi được promtool
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus:/cfg" \
            "$PROM_IMAGE" check rules /cfg/alerts.yml

      # Kiểm cú pháp là không đủ: bản đầu của AirflowTaskStuckQueued qua được
      # check rules nhưng đặt ngưỡng cao hơn mốc Airflow tự huỷ task, tức là
      # không bao giờ bật. Unit test mô phỏng số liệu theo thời gian và khẳng
      # định alert phải bật đúng lúc.
      - name: Unit-test alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus:/cfg" \
            "$PROM_IMAGE" test rules /cfg/tests/pipeline.test.yml \
              /cfg/tests/time-and-cicd.test.yml
