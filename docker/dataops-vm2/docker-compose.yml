services:
  postgres:
    image: postgres:15.17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - data-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio_storage
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - data-net
    volumes:
      - minio_data:/data

  redis:
    image: redis:7.4.9
    container_name: redis_cache
    restart: always
    # Redis mặc định không có xác thực. Cổng 6379 phải publish cho VM1 dùng
    # nên bắt buộc đặt mật khẩu, nếu không ai trong mạng lab cũng đọc ghi
    # được hàng đợi task của Airflow.
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD chua duoc dat}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD chua duoc dat}
    ports:
      - "6379:6379"
    networks:
      - data-net

volumes:
  postgres_data:
  minio_data:

networks:
  # Network riêng cho tầng dữ liệu, không dùng chung với stack khác.
  data-net:
    driver: bridge
