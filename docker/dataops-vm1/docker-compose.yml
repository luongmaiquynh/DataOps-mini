# Tên project tách riêng khỏi stack monitoring cùng thư mục, nếu không
# Compose lấy tên thư mục làm tên project và coi container của stack kia
# là orphan — `down --remove-orphans` sẽ xoá nhầm.
# Stack này chỉ dùng bind mount, không có named volume, nên đổi tên an toàn.
name: dataops-airflow

x-airflow-common: &airflow-common
  image: apache/airflow:2.7.1
  restart: always
  environment:
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__CELERY__BROKER_URL: ${AIRFLOW__CELERY__BROKER_URL}
    AIRFLOW__CELERY__RESULT_BACKEND: ${AIRFLOW__CELERY__RESULT_BACKEND}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Trước đây thiếu hẳn nhóm biến này nên DAG phải dùng giá trị hardcode
    # trong code để kết nối MinIO.
    MINIO_HOST: ${MINIO_HOST:?MINIO_HOST chua duoc dat}
    MINIO_PORT: ${MINIO_PORT:?MINIO_PORT chua duoc dat}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER chua duoc dat}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD chua duoc dat}
    MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET chua duoc dat}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    _PIP_ADDITIONAL_REQUIREMENTS: "boto3==1.34.0 psycopg2-binary==2.9.9 pandas==2.0.3 requests==2.31.0 sqlalchemy==1.4.52"
  volumes:
    - ../../pipeline/dags:/opt/airflow/dags
    - ../../pipeline/etl:/opt/airflow/dags/etl
    - ../../sample_data:/opt/airflow/sample_data
    - ../../logs:/opt/airflow/logs
    - ../../plugins:/opt/airflow/plugins

services:
  # Chỉ chạy khi gọi rõ profile init (Ansible gọi ở bước migration).
  # Nếu để trong `up` thường, Compose khởi động lại nó mỗi lần deploy và
  # playbook không bao giờ đạt changed=0.
  airflow-init:
    <<: *airflow-common
    profiles:
      - init
    restart: no
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@dataops.local"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler

  airflow-worker:
    <<: *airflow-common
    container_name: airflow_worker
    command: celery worker

  airflow-flower:
    <<: *airflow-common
    container_name: airflow_flower
    command: celery flower
    ports:
      - "5555:5555"

networks:
  default:
    name: dataops-vm1-net
    driver: bridge
