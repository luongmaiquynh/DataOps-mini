# Giữ đúng tên project cũ (tên thư mục) vì các named volume hiện có mang
# tiền tố dataops-vm1_: đổi tên sẽ tạo volume mới và mất dữ liệu Grafana,
# Prometheus, Loki.
name: dataops-vm1

services:

  # Cổng vào duy nhất cho mọi giao diện web của VM1, tất cả đều qua HTTPS.
  caddy:
    image: caddy:2.11.4-alpine
    container_name: caddy
    restart: always
    volumes:
      - ../../monitoring/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # giữ CA nội bộ, không sinh lại mỗi lần restart
      - caddy_config:/config
    ports:
      - "80:80"     # chỉ để chuyển hướng sang HTTPS
      - "443:443"
    networks:
      - monitoring
      - airflow-net
    depends_on:
      - grafana
      - prometheus

  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: prometheus
    restart: always
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    # Không publish: chỉ truy cập qua Caddy (HTTPS 8445)
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.0.1-security-01
    container_name: grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD chua duoc dat}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: https://grafana.dataops.test/
    volumes:
      - grafana_data:/var/lib/grafana
      # Mount trước đây trỏ thư mục dashboard vào chỗ dành cho file provisioning
      # nên Grafana không nạp được gì. Nay tách đúng hai nơi.
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    # Không publish: chỉ truy cập qua Caddy (HTTPS 8443)
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.7.1
    container_name: loki
    restart: always
    user: "0"
    volumes:
      - ../../monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    # Không publish ra host — Grafana và Promtail gọi qua network nội bộ.
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:3.6.8
    container_name: promtail
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml
    environment:
      - LOKI_URL=http://loki:3100/loki/api/v1/push
    depends_on:
      - loki
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: alertmanager
    restart: always
    volumes:
      - ../../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    # Không publish: chỉ truy cập qua Caddy (HTTPS 8446)
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node_exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    # Không publish ra host: Prometheus scrape qua tên service trong network
    # monitoring. Publish ra host sẽ mở cổng cho cả mạng LAN vì Docker đi
    # vòng qua UFW.
    networks:
      - monitoring

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: postgres_exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable"
    # Không publish ra host — chỉ Prometheus trong cùng network cần truy cập.
    networks:
      - monitoring

  # Thử gọi endpoint từ bên ngoài: container "Up" không có nghĩa dịch vụ trả lời được.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox_exporter
    restart: always
    volumes:
      - ../../monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    # Tên miền nội bộ chỉ có trong /etc/hosts của máy chủ, container không biết.
    # Trỏ thẳng về IP của VM1 để phép thử đi đúng đường người dùng thật đi:
    # qua tường lửa, qua Caddy, rồi mới tới dịch vụ.
    extra_hosts:
      - "grafana.dataops.test:192.168.64.2"
      - "airflow.dataops.test:192.168.64.2"
      - "prometheus.dataops.test:192.168.64.2"
      - "alerts.dataops.test:192.168.64.2"
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # Không publish: chỉ truy cập qua Caddy (HTTPS 8448)
    networks:
      - monitoring

volumes:
  promtail_positions:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  monitoring:
    driver: bridge
  # Network của stack Airflow (project dataops-airflow), để Caddy gọi được
  # airflow_webserver và airflow_flower bằng tên container.
  airflow-net:
    external: true
    name: dataops-vm1-net
