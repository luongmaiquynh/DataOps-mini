---
# VM2 — database và object storage, phục vụ VM1 và VM3
ufw_allow_ports:
  - { port: 5432, comment: "PostgreSQL" }
  - { port: 6379, comment: "Redis" }
  - { port: 9000, comment: "MinIO API" }
  - { port: 9001, comment: "MinIO console" }
  - { port: 9100, comment: "node-exporter" }

# Các stack được systemd dựng lại khi máy khởi động
compose_stacks:
  - { name: "database", dir: "{{ app_dir }}/docker/dataops-vm2", file: "docker-compose.yml" }
