---
# Entrypoint triển khai toàn hệ thống.
# Chạy: ansible-playbook site.yml --ask-become-pass --ask-vault-pass
#
# Thứ tự bắt buộc: VM2 trước (Airflow cần PostgreSQL và Redis sẵn sàng),
# rồi VM1, cuối cùng VM3.
- name: Database layer (VM2)
  hosts: vm2
  become: true
  roles:
    - common
    - docker
    - app_code
    - role: dotenv
      dotenv_dests:
        - "{{ app_dir }}/.env"
        - "{{ app_dir }}/docker/dataops-vm2/.env"
    - database

- name: Airflow and monitoring (VM1)
  hosts: vm1
  become: true
  roles:
    - common
    - docker
    - app_code
    - role: dotenv
      dotenv_dests:
        - "{{ app_dir }}/.env"
        - "{{ app_dir }}/docker/dataops-vm1/.env"
    - airflow
    - monitoring

- name: Node exporter and backup (VM3)
  hosts: vm3
  become: true
  roles:
    - common
    - docker
    - app_code
    - dotenv
    - node_exporter
    - backup
