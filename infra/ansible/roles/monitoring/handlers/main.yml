---
# Alertmanager nạp lại nóng được: kiểm tra cấu hình trước, sai thì dừng và
# Alertmanager giữ nguyên cấu hình đang chạy. Trước đây handler này khởi động
# lại container — cần thiết khi còn mount file lẻ, vì container bám inode cũ.
- name: Reload Alertmanager
  ansible.builtin.shell:
    cmd: |
      set -e
      docker exec alertmanager amtool check-config /etc/alertmanager/alertmanager.yml
      docker exec alertmanager wget -qO- --post-data= http://localhost:9093/-/reload
    executable: /bin/bash
  become: false
  changed_when: true
