---
# alertmanager.yml được render từ template vì URL của dead man's switch là cấu
# hình riêng của từng môi trường. File này bị loại khỏi rsync trong role
# app_code để hai cơ chế không ghi đè lẫn nhau.
- name: Render Alertmanager configuration
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ app_dir }}/monitoring/alertmanager/alertmanager.yml"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  register: am_config

- name: Restart Alertmanager when its configuration changes
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_compose_dir }}"
    files:
      - "{{ monitoring_compose_file }}"
    services:
      - alertmanager
    state: restarted
  become: false
  when: am_config.changed

- name: Deploy monitoring stack
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_compose_dir }}"
    files:
      - "{{ monitoring_compose_file }}"
    state: present
  become: false

# File cấu hình được mount vào container; đổi nội dung không tự có hiệu lực.
# Prometheus chạy với --web.enable-lifecycle nên nạp lại được qua API.
- name: Reload Prometheus configuration
  ansible.builtin.command:
    cmd: docker exec prometheus wget -q -O- --post-data= http://localhost:9090/-/reload
  become: false
  changed_when: false

# Kiểm tra qua chính Caddy: xác nhận cả reverse proxy lẫn dịch vụ phía sau.
# validate_certs tắt vì đây là chứng chỉ do CA nội bộ của Caddy cấp.
- name: Wait for Prometheus to answer through the proxy
  ansible.builtin.uri:
    url: https://prometheus.dataops.test/-/ready
    validate_certs: false
    status_code: 200
  register: prom_ready
  retries: 18
  delay: 5
  until: prom_ready.status is defined and prom_ready.status == 200

- name: Wait for Grafana to answer through the proxy
  ansible.builtin.uri:
    url: https://grafana.dataops.test/api/health
    validate_certs: false
    status_code: 200
  register: grafana_ready
  retries: 18
  delay: 5
  until: grafana_ready.status is defined and grafana_ready.status == 200

- name: Wait for Airflow to answer through the proxy
  ansible.builtin.uri:
    url: https://airflow.dataops.test/health
    validate_certs: false
    status_code: 200
  register: airflow_proxy
  retries: 18
  delay: 5
  until: airflow_proxy.status is defined and airflow_proxy.status == 200
