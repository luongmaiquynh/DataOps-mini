---
# alertmanager.yml được render từ template vì URL của dead man's switch là cấu
# hình riêng của từng môi trường. File này bị loại khỏi rsync trong role
# app_code để hai cơ chế không ghi đè lẫn nhau.
- name: Render Alertmanager configuration
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ app_dir }}/monitoring/alertmanager/alertmanager.yml"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  notify: Reload Alertmanager

- name: Deploy monitoring stack
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_compose_dir }}"
    files:
      - "{{ monitoring_compose_file }}"
    state: present
  become: false

# File cấu hình được mount vào container; đổi nội dung không tự có hiệu lực.
# Prometheus chạy với --web.enable-lifecycle nên nạp lại được qua API.
# Loki và Promtail không nạp lại nóng được: script kiểm tra cấu hình bằng
# container tạm, rồi chỉ khởi động lại dịch vụ nào có cấu hình thật sự đổi.
- name: Apply Loki and Promtail configuration changes
  ansible.builtin.command:
    cmd: bash {{ app_dir }}/monitoring/scripts/apply-monitoring-config.sh
  environment:
    REPO_DIR: "{{ app_dir }}"
  become: false
  register: monitoring_apply
  changed_when: "'APPLIED' in monitoring_apply.stdout"

- name: Reload Prometheus configuration
  ansible.builtin.command:
    cmd: docker exec prometheus wget -q -O- --post-data= http://localhost:9090/-/reload
  become: false
  changed_when: false

# Kiểm tra qua chính Caddy: xác nhận cả reverse proxy lẫn dịch vụ phía sau.
# validate_certs tắt vì đây là chứng chỉ do CA nội bộ của Caddy cấp.
- name: Wait for Prometheus to answer through the proxy
  ansible.builtin.uri:
    url: https://prometheus.dataops.test/-/ready
    validate_certs: false
    status_code: 200
  register: monitoring_prom_ready
  retries: 18
  delay: 5
  until: monitoring_prom_ready.status is defined and monitoring_prom_ready.status == 200

- name: Wait for Grafana to answer through the proxy
  ansible.builtin.uri:
    url: https://grafana.dataops.test/api/health
    validate_certs: false
    status_code: 200
  register: monitoring_grafana_ready
  retries: 18
  delay: 5
  until: monitoring_grafana_ready.status is defined and monitoring_grafana_ready.status == 200

- name: Wait for Airflow to answer through the proxy
  ansible.builtin.uri:
    url: https://airflow.dataops.test/health
    validate_certs: false
    status_code: 200
  register: monitoring_airflow_proxy
  retries: 18
  delay: 5
  until: monitoring_airflow_proxy.status is defined and monitoring_airflow_proxy.status == 200

# Sự cố 17/09/2026: Celery worker ngừng lấy việc 25 giờ mà không alert nào bật,
# vì mọi phép đo đều hỏi "tiến trình còn sống không" thay vì "hàng đợi có vơi
# không". Ba task dưới đây dựng đường đưa câu trả lời đó vào Prometheus.
- name: Create node-exporter textfile directory
  ansible.builtin.file:
    path: "{{ monitoring_textfile_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Install Celery queue metrics script
  ansible.builtin.copy:
    src: "{{ app_dir }}/monitoring/scripts/celery-queue-metrics.sh"
    dest: "{{ monitoring_celery_metrics_script }}"
    remote_src: true
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Ensure Celery metrics log file exists
  ansible.builtin.file:
    path: "{{ monitoring_celery_metrics_log }}"
    state: touch
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
    modification_time: preserve
    access_time: preserve

# Mỗi phút: hàng đợi tắc là chuyện cần biết trong vài phút, không phải vài giờ.
- name: Schedule Celery queue measurement every minute
  ansible.builtin.cron:
    name: Celery queue metrics
    user: "{{ app_user }}"
    minute: "*"
    job: "{{ monitoring_celery_metrics_script }} >> {{ monitoring_celery_metrics_log }} 2>&1"
    state: present

# Runner GitHub đã chết hai lần mà không alert nào bật. Script này đưa trạng thái
# và số lần tự khởi động lại của các unit quan trọng vào Prometheus.
- name: Install systemd unit status metrics script
  ansible.builtin.copy:
    src: "{{ app_dir }}/monitoring/scripts/unit-status-metrics.sh"
    dest: "{{ monitoring_unit_metrics_script }}"
    remote_src: true
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Schedule systemd unit status measurement every minute
  ansible.builtin.cron:
    name: Systemd unit status metrics
    user: "{{ app_user }}"
    minute: "*"
    job: "{{ monitoring_unit_metrics_script }} >/dev/null 2>&1"
    state: present
