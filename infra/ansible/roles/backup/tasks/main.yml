---
# Ubuntu 22.04 chỉ có postgresql-client-14 trong repo mặc định, nhưng server
# là PostgreSQL 15 — pg_dump lệch version sẽ từ chối chạy. Phải thêm repo pgdg.
- name: Add PostgreSQL APT key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/postgresql.asc
    mode: "0644"

- name: Add PostgreSQL repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/postgresql.asc]
      https://apt.postgresql.org/pub/repos/apt
      {{ ansible_facts['distribution_release'] }}-pgdg main
    filename: pgdg
    state: present

- name: Install postgresql-client-15
  ansible.builtin.apt:
    name: postgresql-client-15
    state: present
    update_cache: true

# node-exporter đọc thư mục này để phơi metric của các cron job ra Prometheus.
- name: Create node-exporter textfile directory
  ansible.builtin.file:
    path: "{{ backup_textfile_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Install backup script from synced repo
  ansible.builtin.copy:
    src: "{{ app_dir }}/backup/backup.sh"
    dest: "{{ backup_script }}"
    remote_src: true
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Ensure backup log file exists
  ansible.builtin.file:
    path: "{{ backup_log }}"
    state: touch
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
    modification_time: preserve
    access_time: preserve

# Backup chưa từng restore thì chưa chứng minh được điều gì. Script này chạy
# hàng tuần, restore bản mới nhất vào một PostgreSQL tạm rồi đếm bảng và dòng.
- name: Install restore verification script
  ansible.builtin.copy:
    src: "{{ app_dir }}/backup/restore-test.sh"
    dest: "{{ backup_restore_test_script }}"
    remote_src: true
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Ensure restore test log file exists
  ansible.builtin.file:
    path: "{{ backup_restore_test_log }}"
    state: touch
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
    modification_time: preserve
    access_time: preserve

# MinIO không nằm trong pg_dump. Trước đây data lake hoàn toàn không có bản sao
# nào: mất volume minio_data trên VM2 là mất hết file raw.
- name: Create MinIO backup directory
  ansible.builtin.file:
    path: "{{ backup_minio_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Install MinIO backup script
  ansible.builtin.copy:
    src: "{{ app_dir }}/backup/backup-minio.sh"
    dest: "{{ backup_minio_script }}"
    remote_src: true
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Ensure MinIO backup log file exists
  ansible.builtin.file:
    path: "{{ backup_minio_log }}"
    state: touch
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
    modification_time: preserve
    access_time: preserve

# Lịch chạy dùng systemd timer thay cho cron: 19/09 VM3 tắt đúng giờ 2:30, cron
# không chạy bù nên sao lưu MinIO quá hạn 26 giờ và bật MinioBackupStale.
- name: Remove old backup cron entries
  ansible.builtin.cron:
    name: "{{ item }}"
    user: "{{ app_user }}"
    state: absent
  loop:
    - Daily PostgreSQL backup
    - Daily MinIO backup
    - Weekly backup restore verification

- name: Install backup service units
  ansible.builtin.template:
    src: job.service.j2
    dest: "/etc/systemd/system/{{ item.name }}.service"
    mode: "0644"
  loop: "{{ backup_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd for backup timers

- name: Install backup timer units
  ansible.builtin.template:
    src: job.timer.j2
    dest: "/etc/systemd/system/{{ item.name }}.timer"
    mode: "0644"
  loop: "{{ backup_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd for backup timers

- name: Flush handlers so systemd sees new units
  ansible.builtin.meta: flush_handlers

- name: Enable and start backup timers
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.timer"
    enabled: true
    state: started
  loop: "{{ backup_jobs }}"
  loop_control:
    label: "{{ item.name }}"
