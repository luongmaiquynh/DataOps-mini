---
- name: Install firewall and intrusion prevention packages
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600

# THỨ TỰ QUAN TRỌNG: mở SSH trước khi đặt chính sách chặn mặc định,
# nếu không sẽ tự khoá mình khỏi máy ngay khi bật tường lửa.
- name: Allow SSH through the firewall
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Allow service ports for this host
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: tcp
    comment: "{{ item.comment }}"
  loop: "{{ common_ufw_allow_ports }}"
  loop_control:
    label: "{{ item.port }} ({{ item.comment }})"

# UFW mặc định DROP traffic forward, trong khi Docker tự quản lý phần này
# bằng chain riêng. Để DROP sẽ làm hỏng mạng giữa các container.
- name: Let Docker manage forwarded traffic
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
  notify: Reload ufw

- name: Deny all other incoming traffic by default
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow all outgoing traffic
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable the firewall
  community.general.ufw:
    state: enabled

- name: Configure fail2ban for sshd
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# validate chạy `sshd -t` trên file mới TRƯỚC khi ghi đè: cấu hình sai
# sẽ làm task fail thay vì làm hỏng dịch vụ SSH.
- name: Harden SSH configuration
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when: common_ssh_hardening_enabled
  notify: Reload sshd

# Để chính máy này gọi được các tên miền nội bộ (health check chạy trên VM1).
- name: Map internal hostnames to loopback
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^127\\.0\\.0\\.1\\s+{{ item }}$"
    line: "127.0.0.1 {{ item }}"
    state: present
  loop: "{{ common_local_hostnames }}"

# Cài chrony sẽ tự gỡ systemd-timesyncd (gói khai báo Conflicts: time-daemon).
- name: Install chrony for time synchronisation
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Ensure chrony is running
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

# node-exporter đọc thư mục này để đưa số đo của script định kỳ vào Prometheus.
- name: Create node-exporter textfile directory
  ansible.builtin.file:
    path: "{{ common_textfile_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

# Đẩy thẳng từ máy điều khiển, không đợi role app_code: role common chạy trước nó,
# và trên máy dựng mới thì repo chưa có ở VM.
- name: Install chrony guard script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../monitoring/scripts/chrony-guard.sh"
    dest: "{{ common_chrony_guard_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Install chrony guard unit files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - dataops-chrony-guard.service
    - dataops-chrony-guard.timer
  notify: Reload systemd for chrony guard

- name: Flush handlers so systemd sees the chrony guard units
  ansible.builtin.meta: flush_handlers

- name: Enable and start chrony guard timer
  ansible.builtin.systemd_service:
    name: dataops-chrony-guard.timer
    enabled: true
    state: started
