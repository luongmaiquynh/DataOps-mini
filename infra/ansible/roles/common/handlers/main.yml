---
- name: Reload sshd
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload ufw
  community.general.ufw:
    state: reloaded

- name: Restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

# Tên riêng cho role này: handler trùng tên giữa các role thì Ansible chỉ giữ một.
- name: Reload systemd for chrony guard
  ansible.builtin.systemd_service:
    daemon_reload: true
