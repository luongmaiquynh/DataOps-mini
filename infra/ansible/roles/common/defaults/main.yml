---
# Cổng mở thêm ngoài SSH — khai báo riêng cho từng máy trong host_vars/
common_ufw_allow_ports: []
common_ssh_hardening_enabled: true
common_local_hostnames: []

# Đồng bộ giờ. maxpoll 6 = hỏi lại khoảng mỗi 64 giây, để VM thức dậy sau khi máy
# Mac ngủ được chỉnh giờ trong vòng một phút thay vì tới 34 phút.
common_ntp_pools:
  - ntp.ubuntu.com
common_ntp_maxpoll: 6

# Script tự chữa khi chrony kẹt sau khi máy Mac ngủ lâu (sự cố 20/09: lệch 8 giờ,
# chrony loại hết nguồn và nằm im; chỉ khởi động lại dịch vụ mới chữa được).
common_chrony_guard_script: /usr/local/bin/dataops-chrony-guard
common_chrony_guard_interval: 1min
common_textfile_dir: /var/lib/node_exporter/textfile
