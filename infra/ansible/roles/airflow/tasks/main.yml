---
# Build image tại chỗ thay vì kéo từ registry: lab không có registry riêng, và
# build một lần rồi dùng mãi vẫn tốt hơn tải thư viện ở mỗi lần container chạy.
# Tag mang hash requirements nên chỉ build lại khi danh sách thư viện thay đổi.
- name: Build the Airflow image
  community.docker.docker_image:
    name: "{{ airflow_image_name }}"
    tag: "{{ airflow_image_tag }}"
    source: build
    build:
      path: "{{ app_dir }}/docker/airflow"
      pull: false
    state: present
    force_source: false
  become: false
  register: airflow_build
  retries: 3
  delay: 30
  until: airflow_build is succeeded

# `airflow db migrate` là lệnh hội tụ: chạy lại trên DB đã migrate là no-op.
# Nó chỉ in "Running upgrade" khi thực sự áp dụng revision mới, nên dùng
# đúng dấu hiệu đó làm điều kiện báo changed thay vì báo bừa mỗi lần chạy.
- name: Run Airflow metadata DB migration
  ansible.builtin.command:
    cmd: docker compose --profile init run --rm airflow-init
    chdir: "{{ airflow_compose_dir }}"
  become: false
  register: airflow_init
  changed_when: "'Running upgrade' in airflow_init.stdout"
  # Container cài thư viện Python từ Internet mỗi lần khởi động, nên bước này
  # phụ thuộc mạng và đã fail thật vì pip tải dở dang. GĐ 5.3 sẽ bỏ hẳn phụ
  # thuộc này bằng cách build image riêng.
  retries: 3
  delay: 30
  until: airflow_init.rc == 0

- name: Deploy Airflow stack
  community.docker.docker_compose_v2:
    project_src: "{{ airflow_compose_dir }}"
    files:
      - docker-compose.yml
    state: present
  become: false

# Kiểm tra từ bên trong container: cổng 8080 không còn publish ra host, và
# Caddy (nằm ở stack monitoring, triển khai sau) chưa chắc đã chạy ở bước này.
- name: Wait for Airflow webserver to become healthy
  ansible.builtin.command:
    cmd: docker exec airflow_webserver curl -fsS -o /dev/null http://localhost:8080/health
  become: false
  register: airflow_health
  changed_when: false
  retries: 30
  delay: 10
  until: airflow_health.rc == 0

# Airflow 2.7.1 KHÔNG có lệnh `airflow users reset-password`: `airflow users`
# chỉ có create/delete/list/import/export/add-role/remove-role. Tài khoản admin
# tạo từ lần khởi tạo đầu vì thế không đổi được mật khẩu bằng CLI, mà xoá đi tạo
# lại thì mất luôn quyền và lịch sử. Đường còn lại là gọi thẳng security manager
# của Flask-AppBuilder.
#
# So mật khẩu hiện tại với vault trước khi ghi, nên chạy lại playbook không báo
# changed bừa. Mật khẩu đi qua biến môi trường của `docker exec`, không nằm trong
# dòng lệnh để khỏi lộ trong `ps`.
- name: Ensure the Airflow admin password matches the vault
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      cat <<'PYEOF' | docker exec -i \
        -e ADMIN_USER="{{ env_airflow_admin_user }}" \
        -e ADMIN_PASS="{{ vault_airflow_admin_password }}" \
        airflow_webserver python -
      import os
      from airflow.www.app import cached_app
      from werkzeug.security import check_password_hash

      sm = cached_app().appbuilder.sm
      user = sm.find_user(username=os.environ["ADMIN_USER"])
      if user is None:
          print("MISSING_USER")
          raise SystemExit(1)
      if check_password_hash(user.password, os.environ["ADMIN_PASS"]):
          print("ALREADY_MATCHES")
      else:
          sm.reset_password(user.id, os.environ["ADMIN_PASS"])
          print("PASSWORD_UPDATED")
      PYEOF
    executable: /bin/bash
  become: false
  register: airflow_admin_password
  changed_when: "'PASSWORD_UPDATED' in airflow_admin_password.stdout"
  no_log: true
