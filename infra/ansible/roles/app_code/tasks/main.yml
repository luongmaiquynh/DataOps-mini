---
- name: Ensure app directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

# Đẩy code từ máy điều khiển thay vì `git pull` trên VM: VM2 và VM3 không
# có thông tin đăng nhập GitHub, và cách này không phụ thuộc vào repo
# private hay mạng ra ngoài của VM.
- name: Sync repository from control node
  ansible.posix.synchronize:
    src: "{{ app_code_repo_root }}/"
    dest: "{{ app_dir }}/"
    archive: false
    recursive: true
    times: true
    perms: true
    delete: false
    # module mặc định thêm --delay-updates, cờ này xung khắc với --inplace
    delay_updates: false
    # --inplace giữ nguyên inode của file. Docker mount file cấu hình đơn lẻ
    # theo inode, nên nếu rsync tạo file mới thì container vẫn đọc bản cũ —
    # đã xảy ra thật với alerts.yml: host có 10 alert, Prometheus chỉ thấy 6.
    rsync_opts: "{{ app_code_excludes + ['--inplace'] }}"
  become: false
