---
# Vì sao cần systemd: `restart: always` của Docker chỉ giữ container đang chạy,
# nó không dựng lại container đã bị xoá. Quy trình tắt máy dùng `compose down`
# xoá container, nên sau khi VM khởi động lại thì không còn gì chạy — đã xảy ra
# thật sáng 15/09/2026.
- name: Install systemd unit for each compose stack
  ansible.builtin.template:
    src: stack.service.j2
    dest: "/etc/systemd/system/dataops-{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ compose_units_stacks }}"
  loop_control:
    label: "dataops-{{ item.name }}.service"
  notify: Reload systemd

# Enable thôi là chưa đủ: unit cài xong nhưng chưa bao giờ chạy thì ở trạng thái
# inactive, và systemd chỉ gọi ExecStop (compose stop) cho unit đang active — tắt
# máy sẽ không dừng stack gọn gàng. Đã thấy thật trên VM1: hai unit cài ngày 15/09
# chưa chạy lần nào vì VM1 chưa khởi động lại từ đó. Với stack đang chạy, `up -d`
# của unit không làm gì cả, nên bật unit ở đây là an toàn.
- name: Enable and start stacks
  ansible.builtin.systemd_service:
    name: "dataops-{{ item.name }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ compose_units_stacks }}"
  loop_control:
    label: "dataops-{{ item.name }}.service"
