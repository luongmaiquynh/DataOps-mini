---
# Đổi mật khẩu user PostgreSQL cho khớp với giá trị hiện tại trong vault.
# Chạy: ansible-playbook rotate-db-password.yml
#
# Vì sao cần playbook riêng: biến POSTGRES_PASSWORD trong .env chỉ có tác dụng
# lúc khởi tạo volume lần đầu. Database đã tồn tại thì phải ALTER USER.
#
# Thứ tự đúng khi đổi mật khẩu:
#   1. Sửa vault_postgres_password trong group_vars/all/vault.yml
#   2. Chạy playbook này (database nhận mật khẩu mới)
#   3. Chạy site.yml cho vm2 -> vm1 -> vm3 (các service nhận .env mới)
- name: Rotate PostgreSQL user password
  hosts: vm2
  become: false

  tasks:
    - name: Apply password from vault to the database user
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - postgres_db
          - psql
          - -U
          - "{{ env_postgres_user }}"
          - -d
          - "{{ env_postgres_db }}"
          - -c
          - "ALTER USER {{ env_postgres_user }} WITH PASSWORD '{{ vault_postgres_password }}'"
      register: alter_result
      changed_when: "'ALTER ROLE' in alter_result.stdout"
      no_log: true

    - name: Report result without revealing the password
      ansible.builtin.debug:
        msg: "Đổi mật khẩu PostgreSQL: {{ 'thành công' if alter_result.rc == 0 else 'THẤT BẠI' }}"
