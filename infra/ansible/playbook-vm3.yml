---
- name: Deploy worker + backup on VM3
  hosts: vm3
  become: true

  vars:
    app_dir: /home/dataops/dataops
    backup_script: /home/dataops/backup.sh
    backup_dir: /opt/backup/postgres

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Install postgresql-client-15
      apt:
        name: postgresql-client-15
        state: present

    - name: Create backup directory
      file:
        path: "{{ backup_dir }}"
        state: directory
        owner: dataops
        group: dataops
        mode: '0755'

    - name: Copy backup script
      copy:
        src: ../../backup/backup.sh
        dest: "{{ backup_script }}"
        owner: dataops
        group: dataops
        mode: '0755'

    - name: Create backup log file
      file:
        path: /var/log/dataops-backup.log
        state: touch
        owner: dataops
        group: dataops
        mode: '0644'

    - name: Setup backup cron job
      cron:
        name: "Daily PostgreSQL backup"
        user: dataops
        minute: "0"
        hour: "2"
        job: "{{ backup_script }} >> /var/log/dataops-backup.log 2>&1"
        state: present

    - name: Deploy node-exporter
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        files:
          - docker/dataops-vm3/docker-compose.yml
        state: present
        pull: always
      become_user: dataops
      ignore_errors: yes
