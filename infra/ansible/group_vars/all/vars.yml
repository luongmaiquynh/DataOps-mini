---
# Giá trị không nhạy cảm — commit bình thường.
# Secret nằm trong vault.yml (đã mã hoá).

env_postgres_user: 'dataops'
env_postgres_db: 'dataops_db'
env_postgres_host: '192.168.64.3'
env_postgres_port: '5432'
env_redis_host: '192.168.64.3'
env_redis_port: '6379'
env_minio_host: '192.168.64.3'
env_minio_port: '9000'
env_minio_console_port: '9001'
env_minio_bucket: 'dataops-lake'
env_grafana_admin_user: 'admin'
env_airflow_admin_user: 'admin'

# URL nhip tim cho dead man's switch (healthchecks.io) — giá trị nằm trong vault
monitoring_dead_mans_switch_url: "{{ vault_dead_mans_switch_url }}"

# Tag image Airflow mang hash của requirements.txt: đổi thư viện là tag đổi theo,
# nên không bao giờ chạy nhầm image cũ.
airflow_image_name: dataops-airflow
# Tên image đổi khi Dockerfile HOẶC requirements đổi. Bản cũ viết cứng "2.7.1" và chỉ
# băm requirements: đổi FROM sang 2.7.3 thì tên giữ nguyên, Ansible thấy image "đã có"
# nên không build lại, hệ thống âm thầm chạy bản cũ.
airflow_dockerfile: "{{ lookup('file', playbook_dir + '/../../docker/airflow/Dockerfile') }}"
airflow_requirements: "{{ lookup('file', playbook_dir + '/../../docker/airflow/requirements.txt') }}"
airflow_base_version: "{{ airflow_dockerfile | regex_search('apache/airflow:([0-9.]+)', '\\1') | first }}"
airflow_source_hash: "{{ (airflow_dockerfile ~ airflow_requirements) | hash('sha1') | truncate(10, true, '') }}"
airflow_image_tag: "{{ airflow_base_version }}-{{ airflow_source_hash }}"
airflow_image: "{{ airflow_image_name }}:{{ airflow_image_tag }}"
