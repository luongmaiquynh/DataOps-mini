[defaults]
# Mật khẩu vault đọc từ file ngoài repo, quyền 600 — không phải gõ mỗi lần
vault_password_file = ~/.ansible/vault_pass_dataops
inventory         = inventory.ini
host_key_checking = False
remote_user       = dataops
stdout_callback   = default
result_format     = yaml

[ssh_connection]
pipelining = True
