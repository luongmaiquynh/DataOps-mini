---
- name: Deploy database stack on VM2
  hosts: vm2
  become: true

  vars:
    app_dir: /home/dataops/dataops
    compose_file: docker/dataops-vm2/docker-compose.yml

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Pull latest code from git
      git:
        repo: "{{ lookup('env', 'GIT_REPO_URL') }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes
      become_user: dataops

    - name: Copy .env file
      copy:
        src: ../../.env
        dest: "{{ app_dir }}/.env"
        owner: dataops
        group: dataops
        mode: '0600'

    - name: Deploy PostgreSQL + Redis + MinIO
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        files:
          - "{{ compose_file }}"
        state: present
        pull: always
      become_user: dataops

    - name: Wait for PostgreSQL to be ready
      wait_for:
        host: localhost
        port: 5432
        delay: 5
        timeout: 60

    - name: Verify PostgreSQL is accepting connections
      command: docker exec postgres_db pg_isready -U dataops
      register: pg_status
      changed_when: false
      failed_when: pg_status.rc != 0
